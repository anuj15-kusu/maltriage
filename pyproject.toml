[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maltriage"
version = "0.1.0"
description = "Static malware triage: hashes, file type detection, PE/Office/PDF analysis, YARA, scoring and reports."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["malware", "triage", "dfir", "yara", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "requests>=2.32",
  "tenacity>=8.3",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "filetype>=1.2",
  "ppdeep>=20200517",
  "pefile>=2023.2.7",
  "pyelftools>=0.31",
  "oletools>=0.60.1",
  "pikepdf>=9.0",
  "yara-python>=4.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
maltriage = "maltriage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maltriage = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer requires function calls (Option/Argument) in parameter defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
