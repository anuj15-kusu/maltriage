name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: pytest -q

  container:
    name: container build + hardened run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t maltriage:ci .

      - name: Image runs as an unprivileged user
        run: |
          output=$(docker run --rm --entrypoint id maltriage:ci)
          echo "$output"
          echo "$output" | grep -q "uid=10001" || { echo "image does not run as uid 10001"; exit 1; }

      - name: Triage a sample inside the container
        run: |
          mkdir -p samples out
          python - <<'PY'
          from pathlib import Path

          Path("samples/eicar.txt").write_bytes(
              b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*")
          PY
          docker run --rm \
            --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g -u 10001:10001 \
            -v "$PWD/samples:/samples:ro" -v "$PWD/out:/work/out" \
            maltriage:ci scan /samples/eicar.txt -o /work/out -f json,html --offline

      - name: Assert the report
        run: |
          python - <<'PY'
          import glob
          import json
          from pathlib import Path

          reports = [p for p in glob.glob("out/*.json") if not p.endswith(".stix.json")]
          assert reports, "no JSON report was written to the mounted out/ directory"

          payload = json.loads(Path(reports[0]).read_text())
          assert payload["verdict"]["score"] >= 20, "rules/ was not found inside the image"
          assert any(f["analyzer"] == "yara" for f in payload["findings"]), "no YARA finding"

          html = glob.glob("out/*.html")
          assert html, "templates/ was not found inside the image"
          assert "Static triage report" in Path(html[0]).read_text()

          verdict = payload["verdict"]
          print(f"container OK: score {verdict['score']} ({verdict['band']})")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-reports
          path: out/
          if-no-files-found: warn
          retention-days: 7
