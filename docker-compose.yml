# Isolated triage. Samples are untrusted input for the parsers and are never executed.
services:
  triage:
    build: .
    image: maltriage:latest
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # No egress by default: pure offline static triage. For VirusTotal enrichment
    # switch to `network_mode: bridge` and add `env_file: [.env]` — the key stays
    # out of the image because .env is listed in .dockerignore.
    network_mode: none
    volumes:
      - ./samples:/samples:ro
      - ./out:/work/out
      - ./rules/local:/work/rules/local:ro
      - cache:/work/.cache
    command: ["batch", "/samples", "-o", "/work/out", "-f", "json,html", "--offline"]

volumes:
  cache:
